  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Do I need council approval for a retaining wall in Perth?","acceptedAnswer":{"@type":"Answer","text":"It depends on the council or shire, the height, where the wall sits on the block and what it holds up. There is no single Perth wide rule. The approval section above explains the triggers; confirm with your own local government before committing."}},{"@type":"Question","name":"What is the difference between a retaining wall and a garden wall?","acceptedAnswer":{"@type":"Answer","text":"Level ground on both sides is a garden or boundary wall, holding up only itself. Higher ground on one side means the wall is retaining soil, which needs a heavier footing, drainage behind the base and possibly engineering."}},{"@type":"Question","name":"Is limestone cheaper than concrete sleepers?","acceptedAnswer":{"@type":"Answer","text":"It depends on height, access and whether the block is natural or reconstituted. Limestone's advantage in Perth is local supply and appearance rather than being automatically the cheapest option."}},{"@type":"Question","name":"How long does a limestone retaining wall last?","acceptedAnswer":{"@type":"Answer","text":"Limestone walls in Perth commonly stand for decades. What shortens that is almost always water: drainage that was never installed properly, or backfill that traps water behind the wall. The drainage detail matters more than the block."}}]}</script>
