  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How much does a limestone retaining wall cost per metre in Perth?","acceptedAnswer":{"@type":"Answer","text":"The per metre figure depends heavily on height and access, and a single number would mislead more readers than it helps. This page explains what drives the number; ranges will be published here once there is a real, dated set of Perth quotes behind them."}},{"@type":"Question","name":"Is limestone cheaper than concrete sleepers?","acceptedAnswer":{"@type":"Answer","text":"It depends on height, access and block type. Limestone's advantage in Perth is local supply and appearance rather than automatically being the lowest cost option."}},{"@type":"Question","name":"Why are two quotes for the same wall so different?","acceptedAnswer":{"@type":"Answer","text":"Usually footing size, drainage, spoil removal, mortar finish or access assumptions. Compare the line items rather than the totals."}},{"@type":"Question","name":"Does a taller wall cost proportionally more?","acceptedAnswer":{"@type":"Answer","text":"No, it costs more than proportionally. Footing depth and engineering requirements step up with height rather than scaling smoothly, so a wall twice as tall generally costs considerably more than twice as much."}}]}</script>
