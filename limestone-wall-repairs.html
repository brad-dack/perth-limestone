  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can a leaning limestone retaining wall be repaired, or does it need rebuilding?","acceptedAnswer":{"@type":"Answer","text":"It depends on the cause. A small section pushed out by a blocked drain is often a repair. A wall that has moved along its full length, usually because of drainage or footing, is often better rebuilt, because a patch on a bad footing fails again."}},{"@type":"Question","name":"What is bullnose capping?","acceptedAnswer":{"@type":"Answer","text":"Capping is the finishing course along the top of a wall, and it sheds water off the top rather than letting it soak into the joints. Bullnose capping has a rounded front edge rather than a square one, a common Perth finish."}},{"@type":"Question","name":"Is limestone cladding the same as a limestone wall?","acceptedAnswer":{"@type":"Answer","text":"No. Cladding is a limestone face applied over an existing structure. It is a finish rather than a structural or retaining wall, and it is priced differently."}},{"@type":"Question","name":"Why does mortar colour matter on a repair?","acceptedAnswer":{"@type":"Answer","text":"Mortar tinted to match the limestone reads as one material, while default grey mortar shows every joint. On a repair it matters more, because fresh grey mortar against a weathered wall stands out permanently."}}]}</script>
